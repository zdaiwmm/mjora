name: Native regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  simulator:
    name: iOS simulator tests
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_SHA }}
          persist-credentials: false
      - name: Verify checkout and toolchain
        run: |
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          test -z "$(git status --porcelain)"
          printf 'Source: %s\n' "$TEST_SHA"
          xcodebuild -version
          xcrun simctl list devices available
      - name: Install XcodeGen
        run: |
          cd "$RUNNER_TEMP"
          curl --location --fail --silent --show-error --max-time 120 --retry 3 \
            --output xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip' | shasum -a 256 --check
          unzip -q xcodegen.zip
          xcodegen_path="$RUNNER_TEMP/xcodegen/bin/xcodegen"
          "$xcodegen_path" --version
          printf 'IMORA_XCODEGEN_PATH=%s\n' "$xcodegen_path" >> "$GITHUB_ENV"
      - name: Build and test on a simulator with Photos permission
        run: |
          device_id=$(xcrun simctl create Imora-CI com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-27-2)
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          destination="platform=iOS Simulator,id=$device_id"
          "$IMORA_XCODEGEN_PATH" generate
          lock_dir=Imora.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          mkdir -p "$lock_dir"
          cp config/Package.resolved "$lock_dir/Package.resolved"
          derived_data="$RUNNER_TEMP/ImoraDerivedData"
          build_args=(-project Imora.xcodeproj -scheme Imora -destination "$destination"
            -derivedDataPath "$derived_data" -clonedSourcePackagesDirPath "$RUNNER_TEMP/ImoraSourcePackages"
            -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
            -only-testing:ImoraTests -parallel-testing-enabled NO)
          xcodebuild "${build_args[@]}" build-for-testing
          app="$derived_data/Build/Products/Debug-iphonesimulator/Imora.app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl install "$device_id" "$app"
          xcrun simctl privacy "$device_id" grant photos "$bundle_id"
          xcodebuild "${build_args[@]}" test-without-building \
            -resultBundlePath "$RUNNER_TEMP/ImoraTests.xcresult"
      - name: Save simulator results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imora-unit-${{ env.TEST_SHA }}
          path: ${{ runner.temp }}/ImoraTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  background-toolkit:
    name: Background validation toolkit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_SHA }}
          persist-credentials: false
      - name: Verify checkout and test toolkit
        run: |
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          test -z "$(git status --porcelain)"
          printf 'Source: %s\n' "$TEST_SHA"
          python3 --version
          python3 -B -m unittest discover -s tests/integration/background-validation -p 'test_*.py'
